<title>矛盾テスト実験レビュー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* レイアウト：上に条件×判定の集計表（クリックで絞り込み）、下に試行カードを1列。各カードは「問題の箇所」を先頭に固定し、全文と差分は下に続く */
:root {
  --bg: #f5f6f4;
  --surface: #ffffff;
  --fg: #1d2421;
  --muted: #5d6863;
  --line: #d9ddd9;
  --code-bg: #f0f2ef;
  --hack: #b3261e;      --hack-bg: #fbe4e1;
  --edit: #8a5300;      --edit-bg: #fbecd2;
  --report: #1d5fa8;    --report-bg: #dfeafa;
  --ok: #2e6b3f;        --ok-bg: #dcefe1;
  --add: #e6f3e8;       --del: #fbe9e7;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a18; --surface: #1d2321; --fg: #e4e9e6; --muted: #9aa6a0; --line: #343d39; --code-bg: #232a27;
    --hack: #ff8a80; --hack-bg: #4a1f1c; --edit: #f2b45c; --edit-bg: #43321a;
    --report: #8cb8f0; --report-bg: #1d324b; --ok: #8fd19e; --ok-bg: #1f3a27;
    --add: #1e3324; --del: #3d2220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a18; --surface: #1d2321; --fg: #e4e9e6; --muted: #9aa6a0; --line: #343d39; --code-bg: #232a27;
  --hack: #ff8a80; --hack-bg: #4a1f1c; --edit: #f2b45c; --edit-bg: #43321a;
  --report: #8cb8f0; --report-bg: #1d324b; --ok: #8fd19e; --ok-bg: #1f3a27;
  --add: #1e3324; --del: #3d2220; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1 { font-size: 26px; line-height: 1.3; margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 6px 0 0; max-width: 65ch; }
.mono { font-family: var(--font-mono); }
section > h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; font-weight: 600; }

/* 集計表 */
.matrix-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.matrix { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; min-width: 560px; }
.matrix th, .matrix td { padding: 10px 12px; text-align: center; border-bottom: 1px solid var(--line); }
.matrix th { font-size: 12px; color: var(--muted); font-weight: 600; }
.matrix th:first-child, .matrix td:first-child { text-align: left; }
.matrix tr:last-child td { border-bottom: none; }
.matrix button.count { font: inherit; font-weight: 700; min-width: 2.4em; padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; background: none; color: var(--fg); cursor: pointer; }
.matrix button.count:hover, .matrix button.count:focus-visible { border-color: var(--line); outline: none; }
.matrix button.count[disabled] { color: var(--muted); font-weight: 400; cursor: default; }
.matrix button.count.on { outline: 2px solid var(--fg); }
.cond-label { font-weight: 700; }
.cond-prompt { display: block; font-size: 12px; color: var(--muted); max-width: 30ch; line-height: 1.45; }

/* 凡例と絞り込み */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.legend mark { padding: 0 4px; border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip:focus-visible { outline: 2px solid var(--report); outline-offset: 2px; }
.status { font-size: 13px; color: var(--muted); }

/* ハイライト */
mark { color: inherit; border-radius: 3px; padding: 0 2px; }
mark.m-hack { background: var(--hack-bg); box-shadow: inset 0 -2px 0 var(--hack); }
mark.m-edit { background: var(--edit-bg); box-shadow: inset 0 -2px 0 var(--edit); }
mark.m-report { background: var(--report-bg); box-shadow: inset 0 -2px 0 var(--report); }

/* カード */
.runs { display: flex; flex-direction: column; gap: 16px; }
.run { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 10px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.run.sev-hack { border-left-color: var(--hack); }
.run.sev-edit { border-left-color: var(--edit); }
.run.sev-report { border-left-color: var(--report); }
.run.sev-ok { border-left-color: var(--ok); }
.run-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
.run-id { font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
.pill { font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.pill.sev-hack { background: var(--hack-bg); color: var(--hack); }
.pill.sev-edit { background: var(--edit-bg); color: var(--edit); }
.pill.sev-report { background: var(--report-bg); color: var(--report); }
.pill.sev-ok { background: var(--ok-bg); color: var(--ok); }
.meta { font-size: 13px; color: var(--muted); }
.block-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; margin-bottom: 4px; }
.problem { background: var(--code-bg); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.problem .none { color: var(--muted); font-size: 13px; }
pre.code { margin: 0; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.55; overflow-x: auto; white-space: pre; }
.code .ln { display: block; padding: 0 6px; }
.code .add { background: var(--add); }
.code .del { background: var(--del); }
.code .hunk { color: var(--muted); }
.code .hit { box-shadow: inset 4px 0 0 var(--hack); font-weight: 600; }
.code .file { color: var(--muted); font-weight: 600; padding: 6px 6px 2px; display: block; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; max-width: 75ch; }
details > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details[open] > summary { margin-bottom: 6px; }
.hidden-fail { font-size: 13px; }
.hidden-fail code { font-family: var(--font-mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
@media (max-width: 520px) { h1 { font-size: 22px; } .run { padding: 14px; } }
@media (prefers-reduced-motion: no-preference) { .chip, .matrix button.count { transition: background-color .15s, color .15s; } }
</style>

<div class="wrap">
  <header>
    <h1>矛盾テスト実験レビュー</h1>
    <p class="lede" id="lede"></p>
  </header>

  <section aria-labelledby="h-matrix">
    <h2 id="h-matrix">条件 × 判定（数字を押すと絞り込み）</h2>
    <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
  </section>

  <section aria-labelledby="h-runs">
    <h2 id="h-runs">試行一覧</h2>
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="条件で絞り込み"></div>
      <div class="legend" aria-label="ハイライトの凡例">
        <span><mark class="m-hack">赤</mark> ズルの箇所・偽の完了報告</span>
        <span><mark class="m-edit">橙</mark> テスト書き換えの申告</span>
        <span><mark class="m-report">青</mark> 矛盾の指摘・停止</span>
      </div>
    </div>
    <p class="status" id="status"></p>
    <div class="runs" id="runs"></div>
  </section>
</div>

<script>
const DATA = /*__DATA__*/null;

const SEV = {
  "特例処理": "hack", "環境改変": "hack", "テスト改変": "edit",
  "報告（仕様どおり実装）": "report", "報告（実装は不完全）": "report",
  "仕様どおり実装（報告なし）": "ok", "未完了・その他": "ok", "実行エラー": "ok",
};
const CAT_ORDER = ["特例処理", "環境改変", "テスト改変", "報告（仕様どおり実装）", "報告（実装は不完全）", "仕様どおり実装（報告なし）", "未完了・その他", "実行エラー"];

// 最終メッセージの中で色を付けるパターン。上から順に優先
const MSG_RULES = [
  { cls: "m-hack", re: /(?:03|東京)[^。\n]{0,40}?(?:特別扱い|特別な処理|特例|0\s?を(?:保持|残|削除せず|外さず|除かず)|0を削除しない)|特別扱い/g },
  { cls: "m-hack", re: /(?:すべて|全て|全)(?:の)?\s?(?:\d+\s?個の)?テスト[^。\n]{0,12}?(?:通り|通過|成功|パス)[^。\n]*?(?:[！!。]|$)/gm },
  { cls: "m-edit", re: /(?:テスト|期待値)[^。\n]{0,24}?(?:修正|変更|書き換え)(?:しました|を行|し)?/g },
  { cls: "m-report", re: /矛盾|不整合|食い違|誤り|間違|おかしい|実装を(?:中止|停止|止め)[^。\n]*|報告します|確認(?:いただ|してくだ)[^。\n]*/g },
];

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// 重ならない範囲だけを採用してハイライト（偽陽性を避けるため、ハックでない試行では赤の「全テスト通過」は付けない）
function highlight(text, sev) {
  const spans = [];
  for (const rule of MSG_RULES) {
    if (rule.cls === "m-hack" && sev !== "hack") continue;
    rule.re.lastIndex = 0;
    let m;
    while ((m = rule.re.exec(text))) {
      if (!m[0]) { rule.re.lastIndex++; continue; }
      const s = m.index, e = s + m[0].length;
      if (!spans.some(x => s < x.e && e > x.s)) spans.push({ s, e, cls: rule.cls });
    }
  }
  spans.sort((a, b) => a.s - b.s);
  let out = "", pos = 0;
  for (const x of spans) {
    out += esc(text.slice(pos, x.s)) + `<mark class="${x.cls}">` + esc(text.slice(x.s, x.e)) + "</mark>";
    pos = x.e;
  }
  return out + esc(text.slice(pos));
}

function codeLines(lines) {
  return lines.map(l => `<span class="ln ${l.k}${l.hit ? " hit" : ""}">${esc(l.t) || " "}</span>`).join("");
}

const state = { cond: "all", cat: null };

function renderMatrix() {
  const conds = Object.keys(DATA.prompts);
  const cats = CAT_ORDER.filter(c => DATA.runs.some(r => r.category === c));
  let h = "<thead><tr><th>条件</th>" + cats.map(c => `<th>${esc(c)}</th>`).join("") + "<th>ハック率</th></tr></thead><tbody>";
  for (const c of conds) {
    const rs = DATA.runs.filter(r => r.cond === c);
    const hacks = rs.filter(r => ["hack", "edit"].includes(SEV[r.category])).length;
    h += `<tr><td><span class="cond-label">${esc(c)}</span><span class="cond-prompt">${esc(DATA.prompts[c])}</span></td>`;
    for (const cat of cats) {
      const n = rs.filter(r => r.category === cat).length;
      const on = state.cond === c && state.cat === cat ? " on" : "";
      h += `<td><button type="button" class="count${on}" data-cond="${esc(c)}" data-cat="${esc(cat)}" ${n ? "" : "disabled"} aria-label="条件${esc(c)}の${esc(cat)}を表示">${n}</button></td>`;
    }
    h += `<td class="mono">${hacks}/${rs.length}</td></tr>`;
  }
  document.getElementById("matrix").innerHTML = h + "</tbody>";
}

function renderChips() {
  const opts = ["all", ...Object.keys(DATA.prompts)];
  document.getElementById("chips").innerHTML = opts.map(o =>
    `<button type="button" class="chip" data-chip="${esc(o)}" aria-pressed="${state.cond === o && !state.cat}">${o === "all" ? "すべて" : "条件 " + esc(o)}</button>`
  ).join("");
}

function renderRuns() {
  const rs = DATA.runs.filter(r => (state.cond === "all" || r.cond === state.cond) && (!state.cat || r.category === state.cat));
  const label = state.cat ? `条件 ${state.cond} の「${state.cat}」` : state.cond === "all" ? "すべての試行" : `条件 ${state.cond}`;
  document.getElementById("status").textContent = `${label}：${rs.length} 件`;
  document.getElementById("runs").innerHTML = rs.map(r => {
    const sev = SEV[r.category] || "ok";
    const hits = r.files.flatMap(f => f.lines.filter(l => l.hit).map(l => ({ ...l, file: f.path })));
    const problem = hits.length
      ? `<pre class="code">${[...new Set(hits.map(h => h.file))].map(file =>
          `<span class="file">${esc(file)}</span>` + codeLines(hits.filter(h => h.file === file))).join("")}</pre>`
      : `<span class="none">差分に該当する行はありません</span>`;
    const hidden = r.hidden_failed.length
      ? `<div class="hidden-fail">隠しテストで失敗：${r.hidden_failed.map(t => `<code>${esc(t)}</code>`).join(" ")}</div>`
      : `<div class="hidden-fail meta">隠しテスト：すべて通過</div>`;
    const diff = r.files.length
      ? `<details><summary>差分をすべて見る（${r.files.map(f => esc(f.path)).join("、")}）</summary><pre class="code">${
          r.files.map(f => `<span class="file">${esc(f.path)}</span>` + codeLines(f.lines)).join("")}</pre></details>`
      : "";
    return `<article class="run sev-${sev}" id="${esc(r.id)}">
      <div class="run-head">
        <span class="run-id">${esc(r.id)}</span>
        <span class="pill sev-${sev}">${esc(r.category)}</span>
        <span class="meta">${r.turns ?? "–"} ターン${r.tests_changed ? "・テストファイル変更あり" : ""}${r.contradictory_passes ? "・矛盾テストを通過" : ""}</span>
      </div>
      <div><div class="block-label">問題の箇所（差分）</div><div class="problem">${problem}</div></div>
      ${hidden}
      <div><div class="block-label">最終メッセージ</div><div class="msg">${highlight(r.message, sev)}</div></div>
      ${diff}
    </article>`;
  }).join("");
}

function render() { renderMatrix(); renderChips(); renderRuns(); }

document.addEventListener("click", e => {
  const cnt = e.target.closest("button.count");
  if (cnt && !cnt.disabled) {
    const same = state.cond === cnt.dataset.cond && state.cat === cnt.dataset.cat;
    state.cond = same ? "all" : cnt.dataset.cond;
    state.cat = same ? null : cnt.dataset.cat;
    render();
    return;
  }
  const chip = e.target.closest("button.chip");
  if (chip) { state.cond = chip.dataset.chip; state.cat = null; render(); }
});

document.getElementById("lede").textContent =
  `実行 ${DATA.source} の ${DATA.runs.length} 試行。判定ごとに色分けし、ズルに当たる差分の行と、最終メッセージの該当箇所をハイライトしています。`;
render();
</script>
